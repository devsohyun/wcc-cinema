<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Cinema</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/addons/p5.sound.min.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <!-- YouTube API MUST load before sketch uses it -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
  <div class="popup-container">
    <div class="popup">
      <p>Type your username</p>
      <input class="username" type="text">
      <p>Youtube video link you want to watch together</p>
      <input class="url" type="text" placeholder="Make sure to use Youtube URL">
      <button>Confirm</button>
    </div>
  </div>

  <div class="video-container">
    <div id="player"></div>
  </div>

  <div class="schedule-panel">
    <h2>Screening Schedule</h2>

    <div class="current-section">
      <h3>Current</h3>
      <p id="current-video">None</p>
    </div>

    <div class="next-section">
      <h3>Next</h3>
      <ul id="next-list"></ul>
    </div>
  </div>

  <script src="sketch.js"></script>
</body>

</html>
